name = "miirra-pay"
main = "src/index.ts"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

# Custom domain — serves the Miirra Pay worker + React SPA at pay.miirra.com.
# `custom_domain = true` makes Cloudflare provision the hostname + TLS cert and
# the DNS record automatically on the next `wrangler deploy` (nothing is
# deployed by adding this — it only wires the route).
routes = [
  { pattern = "pay.miirra.com", custom_domain = true }
]

# Miirra Pay is its OWN worker — deliberately not mounted inside miirra-api.
# It owns the payment rail (LYPay), the Neon ledger of record, and the
# TigerBeetle bridge binding. It shares the same Neon database cluster as the
# rest of the platform (miirra_auth_db) but lives in its own `miirra_pay`
# schema, so a bad payments migration can never take the orders API down.

[observability]
enabled = true

# The React SPA (web/dist) is served from this binding. Build it first:
#   cd web && npm install && npm run build
# Unknown non-API paths fall through to the Worker, which returns index.html.
[assets]
directory = "./web/dist"
not_found_handling = "single-page-application"
binding = "ASSETS"